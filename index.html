<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why an $18 PC Can't Play a YouTube Video in 2026</title>
<style>
  :root { --ink: #f3f5f9; --dim: #9aa6bb; --accent: #5ee7ff; --warn: #ff5a4d; --ok: #3bff8f; --panel: rgba(10, 13, 20, .78); --u: min(1vh, 0.5625vw); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07080b; color: var(--ink); overflow: hidden;
    font-family: "Inter", "SF Pro Display", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .fade { transition: opacity .45s ease, transform .45s ease; }
  .off { opacity: 0 !important; pointer-events: none; visibility: hidden; transition: opacity .45s ease, transform .45s ease, visibility 0s .45s; }

  #callout { position: absolute; left: calc(var(--u) * 7); top: calc(var(--u) * 9); max-width: 46%; text-shadow: 0 2px 24px rgba(0,0,0,.9); }
  #callout.off { transform: translateY(calc(var(--u) * 1.5)); }
  #callout .big { font-size: calc(var(--u) * 11); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  #callout .big.md { font-size: calc(var(--u) * 7); }
  #callout .big.sm { font-size: calc(var(--u) * 5.2); }
  #callout .small { margin-top: calc(var(--u) * 1.4); font-size: calc(var(--u) * 2.5); color: var(--dim); letter-spacing: .02em; }
  #callout .rule { width: calc(var(--u) * 7); height: calc(var(--u) * .5); background: var(--accent); margin-bottom: calc(var(--u) * 2); border-radius: 9px; }

  #caption { position: absolute; left: 50%; bottom: calc(var(--u) * 9.5); transform: translateX(-50%); width: min(78%, calc(var(--u) * 150)); text-align: center;
    font-size: calc(var(--u) * 3.1); line-height: 1.38; font-weight: 500; text-shadow: 0 1px 3px #000, 0 0 22px rgba(0,0,0,.95); text-wrap: balance; }
  #caption b { color: var(--accent); font-weight: 700; }
  #caption i { font-style: normal; color: #ffd27a; }

  #labels { position: absolute; inset: 0; pointer-events: none; }
  .label { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: calc(var(--u) * 2.05); font-weight: 600; letter-spacing: .02em; }
  .label span { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); padding: .35em .8em; border-radius: 999px; background: var(--panel); border: 1px solid rgba(94,231,255,.55); backdrop-filter: blur(6px); }
  .label::before { content: ""; position: absolute; left: -1px; top: 0; width: 2px; height: var(--stem); background: linear-gradient(var(--accent), rgba(94,231,255,.15)); }
  .label::after { content: ""; position: absolute; left: -4px; top: calc(var(--stem) - 4px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  #videohud { position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 8); width: calc(var(--u) * 50); padding: calc(var(--u) * 1.6); background: var(--panel); border: 1px solid rgba(255,255,255,.1); border-radius: calc(var(--u) * 1.6); backdrop-filter: blur(8px); }
  #videohud.off { transform: translateX(calc(var(--u) * 3)); }
  #videohud canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: calc(var(--u) * .8); background: #000; }
  #videohud .row { display: flex; justify-content: space-between; align-items: center; margin-top: calc(var(--u) * 1.1); font-size: calc(var(--u) * 1.8); color: var(--dim); font-variant-numeric: tabular-nums; }
  #videohud .row b { color: var(--ink); }
  #videohud .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * .8); margin-top: calc(var(--u) * 1); }
  #videohud .bar { height: calc(var(--u) * 1.3); background: rgba(255,255,255,.09); border-radius: 9px; overflow: hidden; }
  #videohud .bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 9px; }
  .pill { padding: .15em .7em; border-radius: 999px; font-weight: 700; font-size: .92em; background: rgba(255,255,255,.1); color: var(--dim); }
  .pill.on { background: rgba(59,255,143,.16); color: var(--ok); }
  .pill.bad { background: rgba(255,90,77,.16); color: var(--warn); }

  #title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(4,5,8,.72); backdrop-filter: blur(10px); }
  #title .kicker { font-size: calc(var(--u) * 2.4); letter-spacing: .32em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  #title .name { margin-top: calc(var(--u) * 2); font-size: calc(var(--u) * 7.4); font-weight: 800; letter-spacing: -.025em; max-width: 80%; line-height: 1.05; text-wrap: balance; }

  #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 12px; display: flex; gap: 12px; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.75)); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #controls button { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--ink); border-radius: 8px; height: 30px; min-width: 34px; padding: 0 10px; font: inherit; cursor: pointer; }
  #controls button:hover { border-color: var(--accent); }
  #controls button[aria-pressed="false"] { opacity: .5; }
  #scrub { position: relative; flex: 1; height: 22px; cursor: pointer; touch-action: none; }
  #scrub .track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: rgba(255,255,255,.18); border-radius: 9px; }
  #scrub .fill { position: absolute; left: 0; top: 9px; height: 4px; background: var(--accent); border-radius: 9px; }
  #scrub .tick { position: absolute; top: 6px; width: 2px; height: 10px; background: rgba(255,255,255,.6); }
  #chapname { min-width: 0; max-width: 28vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 22px; align-items: center; justify-content: center; background: rgba(4,5,8,.6); backdrop-filter: blur(6px); cursor: pointer; text-align: center; padding: 16px; }
  #start h1 { margin: 0; font-size: clamp(22px, 4.6vw, 54px); font-weight: 800; letter-spacing: -.02em; max-width: 18em; text-wrap: balance; }
  #start .go { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; font-size: 30px; color: var(--accent); padding-left: 6px; }
  #start p { margin: 0; color: var(--dim); font-size: 14px; }
  body.clean #controls, body.clean #start { display: none; }
  body.clean #caption { bottom: calc(var(--u) * 6); }
  body.nocap #caption { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="vignette"></div>
  <div id="labels"></div>
  <div id="callout" class="fade off"><div class="rule"></div><div class="big"></div><div class="small"></div></div>
  <div id="videohud" class="fade off">
    <canvas width="480" height="270"></canvas>
    <div class="row"><span>Playback <b id="vh-res">480p</b></span><span>Dropped frames <b id="vh-drop">0</b></span></div>
    <div class="row"><span>CPU cores</span><b id="vh-cpu">0 %</b></div>
    <div class="bars"><div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div></div>
    <div class="row"><span>HD Graphics 400 media engine</span><span class="pill" id="vh-media">idle</span></div>
  </div>
  <div id="caption" class="fade off"></div>
  <div id="title" class="fade off"><div class="kicker"></div><div class="name"></div></div>
  <div id="controls">
    <button id="play" aria-label="Play or pause">▶</button>
    <span id="time">0:00 / 0:00</span>
    <div id="scrub"><div class="track"></div><div class="fill"></div></div>
    <span id="chapname"></span>
    <button id="cc" aria-pressed="true" aria-label="Captions">CC</button>
    <button id="fs" aria-label="Fullscreen">⛶</button>
  </div>
  <div id="start"><h1>Why an $18 PC Can't Play a YouTube Video in 2026</h1><div class="go">▶</div><p>Space = play / pause · ← → = previous / next line</p></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
